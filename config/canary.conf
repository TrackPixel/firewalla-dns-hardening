# firewalla-dns-hardening: canary sentinel
# Installed as /home/pi/.firewalla/config/dnsmasq_local/fwh-canary.conf
#
# This domain is blocked on purpose. dns_canary.sh checks that it returns
# NXDOMAIN. If it suddenly resolves, the dnsmasq_local layer (and with it the
# Hagezi lists) is no longer active.
# Must match CANARY_DOMAIN in fw-hardening.env.
local=/example.net/
