# firewalla-dns-hardening: DNS rebinding protection
# Installed as /home/pi/.firewalla/config/dnsmasq_local/fwh-rebind.conf
#
# Drops upstream DNS answers that point to private address space
# (10/8, 172.16/12, 192.168/16, link-local). Stops malicious websites from
# using your browser to reach devices on your LAN (router, NAS, cameras).
stop-dns-rebind

# Allow 127.0.0.0/8 and ::1 (some apps and test domains rely on it)
rebind-localhost-ok

# Exceptions: domains that legitimately resolve to a private address.
# One per line, then: sudo systemctl restart firerouter_dns
# rebind-domain-ok=/plex.direct/
# rebind-domain-ok=/lan/
# rebind-domain-ok=/corp.example.com/
